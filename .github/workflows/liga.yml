name: Atualizar Liga
on:
  schedule:
    # Uma vez por dia. O GitHub costuma atrasar horas o agendamento, então pedimos
    # às 21h05 (Dublin no inverno) para tudo estar pronto até a meia-noite.
    # A segunda linha é reserva, caso o GitHub atrase ou pule a primeira.
    - cron: "5 21 * * *"
    - cron: "50 22 * * *"
  workflow_dispatch: {}
permissions:
  contents: write
concurrency:
  group: liga
  cancel-in-progress: false
jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 run.py
      - run: |
          git config user.name liga-bot
          git config user.email liga-bot@users.noreply.github.com
          git add -A
          git diff --cached --quiet || git commit -m "atualizacao $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
